<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вкусный баланс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a phone-sized Telegram Mini App centred on the page; on phones it fills the screen. Same palette as the decision page. */
:root{
  --bg:#EEF2EC; --app:#F6F8F4; --surface:#FFFFFF; --ink:#1D2620; --muted:#66736A; --line:#DFE6DD;
  --basil:#2E7A4E; --basil-soft:#E1EFE5; --on-basil:#FFFFFF;
  --yolk:#D8952A; --yolk-soft:#FBEFD6; --warn:#B4472F; --warn-soft:#F8E4DE;
  --water:#3C82B8; --water-soft:#E0EDF7; --frame:#1D2620; --shade:rgba(20,28,22,.38);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --app:#151B17; --surface:#1D2520; --ink:#E6ECE7; --muted:#9AA89E; --line:#2C3830;
  --basil:#6CC08F; --basil-soft:#1F3428; --on-basil:#0F1411;
  --yolk:#F0BF5E; --yolk-soft:#3A2F17; --warn:#F08A70; --warn-soft:#3B221C;
  --water:#7DB7E3; --water-soft:#1A2B38; --frame:#000000; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --app:#151B17; --surface:#1D2520; --ink:#E6ECE7; --muted:#9AA89E; --line:#2C3830;
  --basil:#6CC08F; --basil-soft:#1F3428; --on-basil:#0F1411;
  --yolk:#F0BF5E; --yolk-soft:#3A2F17; --warn:#F08A70; --warn-soft:#3B221C;
  --water:#7DB7E3; --water-soft:#1A2B38; --frame:#000000; --shade:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 32px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
.stage{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{text-align:center;max-width:60ch;color:var(--muted);font-size:14px}
.cap b{color:var(--ink)}

.phone{position:relative;width:390px;max-width:100%;height:min(820px, calc(100dvh - 120px));min-height:600px;border:10px solid var(--frame);border-radius:44px;background:var(--app);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:520px){
  body{padding-block:8px 8px}
  .phone{border:0;border-radius:0;width:100%;height:calc(100dvh - 70px);min-height:520px;border-radius:16px}
}

/* telegram mini-app chrome */
.tgbar{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.tgbar .x{font-size:14px;font-weight:700;color:var(--water);background:none;border:0;padding:0}
.tgbar .ttl{flex:1;text-align:center;font-weight:800;font-size:15px}
.tgbar .ttl small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;background:var(--app);border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 3px;font-size:13px;font-weight:700}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--basil-soft);color:var(--basil);flex:none}
.av.m{background:var(--yolk-soft);color:var(--yolk)}
.av.k{background:var(--water-soft);color:var(--water)}

.screen{flex:1;overflow-y:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0;line-height:1.2;text-wrap:balance}
h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* tabbar */
.tables{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tbl{flex:none;width:132px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tbl .no{font-family:var(--display);font-weight:500;font-size:18px;color:var(--yolk)}
.tbl .tn{font-weight:800;font-size:13px;line-height:1.25}
.tbl .cnt{font-size:11px;color:var(--muted)}
.tbl[aria-pressed="true"]{border-color:var(--yolk);background:var(--yolk-soft)}
.ourtable{background:var(--yolk-soft);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ourtable b{font-family:var(--display);font-weight:500;font-size:20px;color:var(--yolk)}
.add{width:32px;height:32px;flex:none;border-radius:10px;border:1.5px solid var(--yolk);background:none;color:var(--yolk);font-size:20px;font-weight:800;line-height:1;padding:0}
.add[aria-pressed="true"]{background:var(--yolk);color:var(--surface)}
.intro{font-size:14px;font-style:italic;color:var(--muted);margin:0}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom, 0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;border-radius:10px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--basil)}

/* today */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--display);font-weight:500;font-size:22px;line-height:1}
.ring .c span{font-size:11px;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--basil-soft);color:var(--basil)}
.state.y{background:var(--yolk-soft);color:var(--yolk)}
.state.r{background:var(--warn-soft);color:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macro{font-size:12px;color:var(--muted)}
.macro b{display:block;color:var(--ink);font-size:14px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--basil);border-radius:3px}

.glasses{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.glass{width:24px;height:30px;border:2px solid var(--water);border-top-width:0;border-radius:0 0 7px 7px;position:relative;overflow:hidden}
.glass.f::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;background:var(--water)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;background:var(--basil);color:var(--on-basil)}
.btn.ghost{background:var(--app);color:var(--ink);border:1px solid var(--line)}
.btn.water{background:var(--water-soft);color:var(--water)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}

.vit{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.vit:first-of-type{border-top:0}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.chk svg{width:14px;height:14px;stroke:var(--on-basil);stroke-width:3;fill:none;opacity:0}
.chk[aria-pressed="true"]{background:var(--basil);border-color:var(--basil)}
.chk[aria-pressed="true"] svg{opacity:1}
.done-t{text-decoration:line-through;color:var(--muted)}
.doses{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dose{border:1.5px solid var(--basil);background:none;color:var(--basil);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dose[aria-pressed="true"]{background:var(--basil);color:var(--on-basil)}
.vitedit{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.vitedit:first-child{border-top:0}
.times{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.timechip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:2px 4px 2px 8px}
.timechip input{border:0;background:none;font-size:15px;padding:4px 0;width:6.2em}

.meal{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .tp{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.meal .nm{font-weight:700;font-size:14px;line-height:1.3}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--app);border:1px solid var(--line);color:var(--muted);margin-right:4px}
.kc{font-weight:800;font-size:14px;white-space:nowrap}
.eat{border:1.5px solid var(--basil);background:none;color:var(--basil);border-radius:10px;padding:5px 9px;font-weight:800;font-size:12px;white-space:nowrap}
.eat[aria-pressed="true"]{background:var(--basil);color:var(--on-basil)}
.x-del{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}

/* plan */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--basil-soft);color:var(--basil)}
.factor{display:flex;align-items:center;gap:10px;background:var(--basil-soft);color:var(--basil);border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px}
.factor b{font-family:var(--display);font-weight:500;font-size:20px}
.pcard{display:flex;flex-direction:column;gap:10px}
.eaters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.eater{border:0;padding:0;background:none;border-radius:50%;position:relative}
.eater .av{width:30px;height:30px;font-size:12px}
.eater[aria-pressed="false"] .av{opacity:.28;filter:grayscale(1)}
.vote{border:1px solid var(--line);background:var(--app);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;color:var(--muted)}
.vote[aria-pressed="true"]{border-color:var(--yolk);background:var(--yolk-soft);color:var(--yolk)}

/* menu library */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--app);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px}
.dish{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.dish .nm{font-weight:700;font-size:14px;line-height:1.3}
.list{display:flex;flex-direction:column;gap:8px}

/* shopping */
.shop{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.shop .q{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.by{font-size:11px;font-weight:800;color:var(--muted)}

/* sheet */
.shade{position:absolute;inset:0;background:var(--shade);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:var(--app);border-radius:22px 22px 0 0;padding:10px 16px 20px;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kb div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-size:11px;color:var(--muted)}
.kb b{display:block;font-size:16px;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:15px;width:100%;min-width:0}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 78px 28px;gap:6px;align-items:end}
.big{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1}
.recipe{display:flex;flex-direction:column;gap:10px}
.ings{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.ings b{font-variant-numeric:tabular-nums}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.steps li::marker{font-weight:800;color:var(--basil)}
.linkish{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.linkish:hover .nm,.linkish:hover{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--app);padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;z-index:9;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.example{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--yolk)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

[hidden]{display:none!important}
.qty-in{width:72px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;font-size:14px}
.tbl{width:148px}
.tbl .tn{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}   /* «Средиземноморский» не влезал в карточку */   /* .field{display:flex} иначе перебивает атрибут hidden */
/* полноэкранный режим внутри Telegram */
html,body{height:100%}
body{padding:0!important}
.stage{max-width:none;height:100%;gap:0}
.phone{width:100%;max-width:640px;height:100%;min-height:0;border:0!important;border-radius:0!important;margin:0 auto}
.screen{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
.tgbar{padding-top:calc(10px + env(safe-area-inset-top, 0px))}
/* логотип «Миска» в шапке: знак красится токенами темы */
.tgbar .brand{display:flex;align-items:center;gap:8px;text-align:left;font-family:var(--display);font-weight:500;font-size:15px;white-space:nowrap;min-width:0}
.brand-mark{height:32px;width:auto;flex:none}
.brand-mark .bm-basil{fill:var(--basil)} .brand-mark .bm-yolk{fill:var(--yolk)}
.tgbar .brand{flex:1}
.tgbar .brand>span{order:2;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* «ТЕСТ» — сразу за знаком, чтобы на узком экране обрезалось название, а не метка */
.tgbar .brand small{order:1;flex:none;padding:2px 5px;border-radius:6px;background:var(--warn-soft);font-family:inherit;font-size:10px;font-weight:800;color:var(--warn)}
.tgbar .brand small:empty{display:none}
.tgbar .who{flex:none}
@media (max-width:400px){ #whoName{display:none} .tgbar .who{padding-right:4px} }   /* на телефоне в кнопке профиля только кружок */
</style>
<link rel="icon" type="image/svg+xml" href="logo/svg/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="logo/png/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="logo/png/icon-180.png">
<meta name="theme-color" content="#2E7A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Вкусный баланс">
<meta name="robots" content="noindex">
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.FM_API = "https://script.google.com/macros/s/AKfycbw53r6VIevcdGYWqv_FKpRQmhPAbOHwVcGfHvQQlcZbGRIGLXslT8E1UvT6l7L5y91_/exec";</script>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="tgbar">
      <div class="ttl brand"><svg class="brand-mark" viewBox="14 10 72 80" width="29" height="32" aria-hidden="true"><defs><mask id="bm-y" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M56 42A26 26 0 0 1 78 14A26 26 0 0 1 56 42Z" fill="#000" stroke="#000" stroke-width="4"/><path d="M18 47H82A32 32 0 0 1 18 47Z" fill="#000" stroke="#000" stroke-width="4"/></mask><mask id="bm-l" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M18 47H82A32 32 0 0 1 18 47Z" fill="#000" stroke="#000" stroke-width="4"/></mask></defs><circle class="bm-yolk" cx="40" cy="37" r="15" mask="url(#bm-y)"/><path class="bm-basil" d="M56 42A26 26 0 0 1 78 14A26 26 0 0 1 56 42Z" mask="url(#bm-l)"/><path class="bm-basil" d="M18 47H82A32 32 0 0 1 18 47Z"/><rect class="bm-basil" x="38" y="81" width="24" height="5" rx="2.5"/></svg><span>Вкусный баланс</span><small></small></div>
      <button class="who" type="button" id="whoBtn" aria-label="Мой профиль"><span class="av" id="whoAv">·</span><span id="whoName">Профиль</span></button>
    </div>
    <main class="screen" id="screen"><div class="card" style="margin-top:30px"><h2>Загружаю…</h2><p class="small muted">Первый запуск может занять несколько секунд.</p></div></main>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Сегодня</button>
      <button type="button" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>План</button>
      <button type="button" data-tab="menu"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Меню</button>
      <button type="button" data-tab="party"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5L12 14.4 7.5 16.8l.9-5L4.8 8.3l5-.7z"/><path d="M8 21h8"/></svg>Праздник</button>
      <button type="button" data-tab="shop"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="16.5" cy="19" r="1.3"/></svg>Покупки</button>
      <button type="button" data-tab="sweet"><svg viewBox="0 0 24 24"><path d="M4 14h16l-1.5 6h-13z"/><path d="M6 14c0-4 2.7-7 6-7s6 3 6 7M12 7V4"/></svg>Десерты</button>
    </nav>
    <div id="layer"></div>
  </div>
</div>
<script>
// Вкусный баланс — клиент мини-приложения. Вставляется в Index.html сборкой (tools/build_gas.py).
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const TYPES = [['b','Завтрак'],['l','Обед'],['d','Ужин'],['s','Перекус']];
const TNAME = Object.fromEntries(TYPES);
const GOALS = [['loss','Похудение'],['keep','Поддержание'],['gain','Набор']];

// ---------- связь с сервером ----------
// Страница открыта либо из Apps Script (google.script.run), либо с GitHub Pages (window.FM_API — адрес …/exec)
const GAS = typeof google !== 'undefined' && !!google.script;
function call(action, payload){
  if (GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(INIT, action, payload || {}));
  return fetch(window.FM_API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},   // text/plain — без лишнего CORS-запроса
    body: JSON.stringify({init: INIT, action, payload: payload || {}})})
    .catch(() => { throw new Error('Нет связи с интернетом'); })
    .then(r => r.text()).then(t => { let j; try { j = JSON.parse(t); } catch (e) { throw new Error('Сервер не ответил. Попробуйте ещё раз через минуту'); }
      if (!j.ok) throw new Error(j.e); return j.r; });
}
let queue = Promise.resolve();
function save(action, payload, okMsg){
  const run = () => call(action, payload).then(r => { if (okMsg) toast(okMsg); return r; })
    .catch(e => { toast('Не сохранилось: ' + (e && e.message || e)); throw e; });
  const p = queue.then(run, run);
  queue = p.catch(() => {});
  return p;
}
const uid = () => Math.random().toString(36).slice(2, 10).padEnd(8, '0');
function location_(cb){
  if (GAS) return google.script.url.getLocation(cb);
  const hp = new URLSearchParams(window.location.hash.replace(/^#/, '')), q = new URLSearchParams(window.location.search);
  const store = 'fm_key:' + window.location.pathname;                         // у тестовой и рабочей страницы ключи разные
  let key = hp.get('k') || q.get('k') || '';
  if (!key && hp.get('tgWebAppData') == null) try { key = localStorage.getItem(store) || ''; } catch (e) {}
  if (key) {
    try { localStorage.setItem(store, key); } catch (e) {}
    // ключ остаётся в «#»: так его сохранит иконка на экране «Домой», а на сервер страницы «#» не уходит
    if (!hp.get('k')) try { history.replaceState(null, '', window.location.pathname + '#k=' + key); } catch (e) {}
  }
  const go = () => {
    let hash = window.location.hash;
    const tg = window.Telegram && Telegram.WebApp;
    if (tg && tg.initData && hash.indexOf('tgWebAppData') < 0) hash = '#tgWebAppData=' + encodeURIComponent(tg.initData);
    if (tg && tg.initData) { try { tg.ready(); tg.expand(); } catch (e) {} }
    cb({hash: key ? '' : hash, parameter: {k: key}});
  };
  // telegram-web-app.js грузится асинхронно: Telegram и так кладёт данные в адрес, ждём скрипт не дольше 1,5 с
  if (key || window.location.hash.indexOf('tgWebAppData') >= 0 || (window.Telegram && Telegram.WebApp)) return go();
  let n = 0; const t = setInterval(() => { if ((window.Telegram && Telegram.WebApp) || ++n > 15) { clearInterval(t); go(); } }, 100);
}
function start(){
  location_(loc => {
    const raw = String(loc.hash || '').replace(/^#/, ''), h = new URLSearchParams(raw);
    const key = (loc.parameter && loc.parameter.k) || '';
    INIT = raw.indexOf('tgWebAppData') >= 0 ? raw : key ? 'key:' + key : '';   // сервер сам разберёт и проверит подпись или ключ
    try { const th = JSON.parse(h.get('tgWebAppThemeParams') || '{}'); if (th.bg_color) document.documentElement.dataset.theme = lum(th.bg_color) < .45 ? 'dark' : 'light'; } catch(e) {}
    if (!INIT) return fatal('Откройте приложение из Telegram: чат с ботом → кнопка «Открыть». Для браузера напишите боту /web, он пришлёт личную ссылку.');
    call('boot').then(d => { D = d; D.catalog.desserts = D.catalog.desserts || []; afterBoot(); })
      .catch(e => { const m = String(e && e.message || e);
        if (m.includes('BAD_KEY')) try { localStorage.removeItem('fm_key:' + window.location.pathname); } catch (x) {}
        fatal(m.includes('BAD_KEY') ? 'Ссылка устарела. Напишите боту /web, и он пришлёт новую.' :
              m.includes('NOT_ALLOWED') ? 'Это семейное приложение. Вашего аккаунта нет в списке участников.' :
              m.includes('EXPIRED') ? 'Сессия устарела. Закройте приложение и откройте его снова из бота.' :
              'Не удалось загрузить данные: ' + m); });
  });
}
function lum(hex){ const n = parseInt(hex.replace('#',''), 16); return ((n>>16&255)*.299 + (n>>8&255)*.587 + (n&255)*.114)/255; }
function fatal(msg){ scr.innerHTML = `<div class="card" style="margin-top:30px"><h2>Вкусный баланс</h2><p>${esc(msg)}</p></div>`; }
// одна карточка на id, даже если строку в листе MyFestive импортировали дважды
const uniqById = list => (list || []).filter((x, i, a) => a.findIndex(y => y.id === x.id) === i);   // первая, как find на сервере
// ключи, сохранённые до объединения по жирности («2 5% молок|мл»), приводим к новым («молок|мл») — BUG-057
const oldKey = k => { const [w, u] = String(k).split('|'); if (!/%/.test(w)) return k; return w.split(' ').filter(x => !/^\d+%?$/.test(x)).join(' ') + '|' + (u || ''); };
function afterBoot(){
  D.myfest = uniqById(D.myfest);
  const sh = {}; Object.keys(D.shop || {}).forEach(k => { const i = k.indexOf('|'), nk = k.slice(0, i + 1) + oldKey(k.slice(i + 1)); if (!sh[nk] || D.shop[k]) sh[nk] = D.shop[k]; }); D.shop = sh;
  if (D.shopQty) { const q = {}; Object.keys(D.shopQty).forEach(k => { const i = k.indexOf('|'); q[k.slice(0, i + 1) + oldKey(k.slice(i + 1))] = D.shopQty[k]; }); D.shopQty = q; }
  D.pantry = (D.pantry || []).map(x => Object.assign({}, x, {key: oldKey(x.key)}));
  // началась новая пара дней — списываем из запаса то, что уйдёт на её блюда (сервер делает это один раз на пару)
  if (!(D.consumed || []).includes(D.blocks[0])) {                          // отмечаем начало пары даже при пустом запасе
    const n = blockNeeds(0), items = [...n.map.entries()].filter(([, it]) => !it.raw).map(([key, it]) => ({key, qty: Math.round(it.q * 10) / 10}));
    save('consume', {block: D.blocks[0], items}).then(r => { D.pantry = r.pantry; D.consumed = r.consumed; render(); }).catch(() => {});
  }
  if (D.env === 'test') { document.title = 'ТЕСТ · Вкусный баланс'; const sm = document.querySelector('.tgbar .ttl small'); sm.textContent = 'ТЕСТ'; sm.title = 'Тестовая версия'; }

}

const byId = id => D.catalog.dishes.find(d => d.id === id);
// меню 1–13 — «Меню N»; сборники — по названию. Рецепт сборника рассчитан на np порций, меню — на 2 (1 человек × 2 дня)
const MENU_NAMES = {101: 'Завтраки', 102: 'Ужины'};
const menuName = m => MENU_NAMES[m] || 'Меню ' + m;
const cookFactor = (d, f) => f * 2 / (d.np || 2);   // во сколько раз увеличить рецепт, чтобы накормить f порций на 2 дня
const myProfile = () => D.profiles.find(p => p.id === D.me);
function norm(p){
  if (!p.age || !p.height || !p.weight) return {target:null, k:1, bmr:null, tdee:null};
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex === 'm' ? 5 : -161), tdee = bmr*p.activity;
  let t = p.goal === 'loss' ? tdee*.85 : p.goal === 'gain' ? tdee*1.1 : tdee;
  if (p.goal === 'loss') t = Math.max(t, bmr, p.sex === 'm' ? 1600 : 1400);
  t = Math.round(t/10)*10;
  return {bmr, tdee, target:t, k:t/1400};
}
// участники семьи для порций: взрослые из профилей + дети
function members(){
  return [...D.profiles.map(p => ({key:'u:' + p.id, name:p.name, short:(p.name || '?').slice(0,1).toUpperCase(), cls: p.id === D.profiles[0].id ? '' : 'm', k:norm(p).k})),
          ...D.kids.map((k, i) => ({key:'k:' + (k.id || k.name), legacy:'k:' + k.name, name:k.name, short:'Д' + (i+1), cls:'k', k:k.k}))];
}
// старые отметки «не ест» хранили имя ребёнка вместо id
const skipped = (skip, m) => skip.includes(m.key) || (!!m.legacy && skip.includes(m.legacy));
const slotOf = (b, t) => ((D.plan[D.blocks[b]] || {})[t]) || null;
function factor(slot){ const skip = slot ? slot.skip : []; return members().reduce((a, m) => a + (skipped(skip, m) ? 0 : m.k), 0); }
function blockLabel(i){
  const d = new Date(D.blocks[i] + 'T12:00:00Z'), e = new Date(d); e.setUTCDate(d.getUTCDate() + 1);

  const wd = x => x.toLocaleDateString('ru-RU', {weekday:'short', timeZone:'UTC'});
  return {short: wd(d) + '–' + wd(e), long: f(d) + ' – ' + f(e)};
}

const SIPS = [['Кофе чёрный',2,false],['Кофе с молоком',2,true],['Чай чёрный',1,true],['Чай зелёный',1,true],['Чай фруктовый',3,false],['Какао на молоке',59,false]];

    <div class="seg" id="sp-k" style="flex-wrap:wrap">${SIPS.map(([n], j) => `<button type="button" aria-pressed="${j === 0}" data-sk="${j}">${n}</button>`).join('')}</div>

function bodyChart(k){
  const pts = (D.body || []).filter(x => x[k] != null);
  if (pts.length < 2) return `<p class="small muted">${pts.length ? 'Для графика нужна ещё одна запись.' : 'Записей пока нет.'}</p>`;
  const W = 320, H = 140, P = 26, t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date) || t0 + 1;
  const vs = pts.map(x => x[k]), lo = Math.min(...vs), hi = Math.max(...vs), pad = (hi - lo) * .15 || 1;
  const X = d => P + (Date.parse(d) - t0) / Math.max(1, t1 - t0) * (W - 2*P), Y = v => H - P + 6 - (v - lo + pad) / (hi - lo + 2*pad) * (H - 2*P);
  const line = pts.map(x => X(x.date).toFixed(1) + ',' + Y(x[k]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="График: ${BODY.find(b => b[0] === k)[1]}">

    <text x="${W - P}" y="${H - 4}" font-size="11" fill="var(--muted)" text-anchor="end">${dm(pts[pts.length - 1].date)}</text>
    <text x="4" y="${(Y(hi) + 4).toFixed(1)}" font-size="11" fill="var(--muted)">${num1(hi)}</text>

const CATS = [['Мясо, птица, рыба',/(фарш|(?:^|[^а-яё])кур(?:иц|ин|оч|ят|ы?(?![а-яё]))|индей|говяд|свин|телят|филе|рыб|треск|форел|сёмг|семг|минта|креветк|тунец|краб|ветчин|бедр|голен|крыл|мяс|печ[её]н(?!ь[еяи])|сердеч|цыпл|субпрод|потрох|колбас|сосис|сардел|бекон|сельд(?!ер)|сел[её]д|сайр|горбуш|лосос|скумбр|кальмар)/i],

// «кукурузный крахмал», «рисовая мука» — бакалея, даже если в названии есть овощ или крупа из другого раздела
const DRY = /(крахмал|хлоп|хлебц|мук[аиу](?![а-яё])|круп[аыу](?![а-яё])|сух[а-яё]*\s+завтрак)/i;
const catOf = name => DRY.test(name) ? CATS.length - 1 : CATS.findIndex(([,re]) => re.test(name));
// Строка покупки → {name, q, u}. Порядок важен: ложки, штуки, «4 яйца» (число + слово), граммы/литры.
const PCT = /\d+(?:[.,]\d+)?\s*%/g;   // жирность: в покупках одна строка, проценты — в названии
const SPOON = /(\d+(?:[.,]\d+)?)\s*(ст|ч)\.?\s*л\.?/i;

  else if ((m = line.match(/(\d+(?:[.,]\d+)?)\s*зубч/i))) { q = num(m[1]); u = 'зуб.'; }      // «чеснок 1 зубчик» = «1 зубчик чеснока»
  else if ((m = line.match(/(\d+(?:[.,]\d+)?)\s*(кг|мл|г|л)\.?\s*\/\s*\d+\s*шт/i))) { q = num(m[1]); u = m[2].toLowerCase(); }   // «10г/2шт» — считаем граммы
  else if ((m = line.match(/(\d+(?:[.,]\d+)?)\s*шт/i))) { q = num(m[1]); u = 'шт'; }
  else if ((m = line.match(/^\s*(\d+(?:[.,]\d+)?)\s+[а-яё]/i)) && !/\d\s*(кг|мл|г|л)(?![а-я])/i.test(line)) { q = num(m[1]); u = 'шт'; }
  else if ((m = line.match(/[а-яё]\s+(\d+(?:[.,]\d+)?)\s*$/i))) { q = num(m[1]); u = 'шт'; }   // «яйца 2»
  else { const all = [...line.matchAll(/(\d+(?:[.,]\d+)?)\s*(кг|мл|г|л)(?![а-я])/gi)]; if (all.length) { const last = all[all.length-1]; q = num(last[1]); u = last[2].toLowerCase(); } }

    .replace(/(^|\s)(средн|небольш|крупн|мелк)[а-яё]*/gi, ' ')               // «яблоко средних» = «яблоко»
    .replace(/^\s*\d+(?:[.,]\d+)?\s+/, '').replace(/\s+\d+(?:[.,]\d+)?\s*$/, '')   // «4 яйца», «яйца 2» → «яйца»

  name = name.replace(/^(яйц[оа]?|яиц)(?![а-яё])/i, 'яйца');                  // «яйцо», «яйца», «яиц» — одна строка в покупках
  if (u === 'кг') { q = q == null ? q : q*1000; u = 'г'; } else if (u === 'л') { q = q == null ? q : q*1000; u = 'мл'; }   // «картофель 1 кг» = «картофель 1000 г»

// Строки, разорванные при распознавании PDF («…на ваш вкус) из» + «твердых сортов пшеницы»), склеиваем обратно
const QTY = /\d+(?:[.,]\d+)?\s*(кг|мл|г|л|шт|ст|ч)(?![а-яё])/i;
const CONT = /(?:^|\s)(из|и|с|со|в|во|на|для|или|либо|от|к|без|по|а|но)$|[,–(-]$/i;
// водяные знаки распознанных PDF («Телеграм-канал - @…», «© @…|») — на случай, если остались в таблице
const noWM = t => String(t).replace(/©/g, ' ').replace(/Телеграм[-\s]*канал\s*[-–:]?|(?:t\.me|telegram\.me)\/\S+|(^|[^\w.])@[A-Za-z0-9_]{3,}|©|\s\|\s?/gi, '$1 ').replace(/\s{2,}/g, ' ').replace(/^[|\s]+|[|\s]+$/g, '');
function joinBroken(lines){
  const out = [];
  (lines || []).forEach(l => { const t = noWM(l); if (!t) return;
    // строку со своим количеством («яйца 2 шт») не приклеиваем: это отдельный продукт
    if (out.length && /^[а-яё]/.test(t) && CONT.test(out[out.length - 1]) && !QTY.test(t)) out[out.length - 1] += ' ' + t; else out.push(t); });

}
// Ключ строки покупок: «сыр твердый» = «твердый сыр», «подсолнечное масло» = «масла подсолнечного»
const stem = w => w.replace(/ё/g, 'е').replace(/(ого|его|ому|ему|ыми|ими|ой|ей|ый|ий|ая|яя|ое|ее|ые|ие|ых|их|ую|юю|ом|ем|ам|ям|ах|ях|а|я|ы|и|у|ю|о|е|ь|й)$/, '').slice(0, 6);
const shopKey = name => name.replace(PCT, ' ').toLowerCase().split(/[^а-яёa-z0-9%]+/).filter(Boolean).map(stem).filter(Boolean).sort().join(' ');
// sources: [{lines, f}] → продукты по разделам. f — во сколько раз умножить количества.
function shopBuild(sources){
  const map = new Map();
  sources.forEach(({lines, f, cat}) => { if (!f) return;                          // блюдо никто не ест — продукты не нужны
    joinBroken(lines).map(l => l.replace(/[.\s]*для [а-яё ]+:$/i, '')).filter(l => /[а-яё]/i.test(l) && !/:$/.test(l)).forEach(line => {   // без «…для соуса:», «(на 2 порции):»
      const it = parseLine(line), pct = it.name.match(PCT) || [], base = it.name.replace(PCT, ' ').replace(/\s{2,}/g, ' ').trim() || it.name;
      const key = (shopKey(base) + '|' + it.u).slice(0, 90);                     // «молоко 2,5%» и «3,5% молоко» — одна строка (shopKey без %)
      const cur = map.get(key) || {name: base, q: 0, u: it.u, raw: it.q == null, cat, v: []}; if (it.q != null) { cur.q += it.q*f; cur.raw = false; }
      if (base.length < cur.name.length) cur.name = base;                        // из «репчатого лука» и «лук репчатый» показываем короче
      pct.forEach(x => { x = x.replace(/\s/g, '').replace('.', ','); if (!cur.v.includes(x)) cur.v.push(x); });
      map.set(key, cur); }); });
  map.forEach(it => { if (it.v.length) it.name += ' ' + it.v.sort((a, b) => parseFloat(a.replace(',', '.')) - parseFloat(b.replace(',', '.'))).join(' / '); });
  const groups = [...CATS.map(([c]) => [c, []]), ['Напитки', []]];
  [...map.entries()].forEach(([key, it]) => groups[it.cat === 'drink' ? CATS.length : catOf(it.name)][1].push([key, it]));

const showQ = it => it.raw ? 'по вкусу' : it.u === 'шт' ? Math.ceil(it.q) + ' шт' : it.u === 'зуб.' ? Math.ceil(it.q) + ' ' + plural(Math.ceil(it.q), 'зубчик', 'зубчика', 'зубчиков') : /л\.$/.test(it.u) ? String(Math.round(it.q*2)/2).replace('.', ',') + ' ' + it.u : it.u === 'г' && it.q >= 1000 ? (it.q/1000).toFixed(1).replace('.',',') + ' кг' : it.u === 'мл' && it.q >= 1000 ? (it.q/1000).toFixed(1).replace('.',',') + ' л' : Math.round(it.q/10)*10 + ' ' + it.u;

const stock = key => { const p = pan().find(x => x.key === key); return p ? p.qty : 0; };

function pantryFit(d, bi, sl, av){
  if (!pan().length) return null;
  av = av || availFor(bi); const need = shopBuild([{lines: d.s, f: cookFactor(d, sl ? factor(sl) : familyFactor())}]).map;
  let score = 0; const use = [], buy = [];
  need.forEach((it, key) => { if (it.raw) return; const h = Math.min(av(key), it.q);
    if (h > 0) { score += (h / it.q) * (perish(it.name) ? 3 : 1); use.push(it.name + ' ' + showQ({...it, q: h})); if (it.q > h) buy.push(it.name + ' ' + showQ({...it, q: it.q - h})); } });
  return score ? {score, use, buy} : null;
}

function scaleIng(line, f){
  if (f === 1) return esc(line);
  const r = v => { const x = v*f; return x >= 20 ? String(Math.round(x/5)*5) : x >= 3 ? String(Math.round(x)) : x.toFixed(1).replace('.', ','); };
  let out = line.replace(/(\d+(?:[.,]\d+)?)(\s*)(кг|мл|г|л|шт|ч\.\s?л|ст\.\s?л|зубч[а-яё]*)(?![а-я])/gi,
    (m, v, sp, u) => { let x = r(parseFloat(v.replace(',','.')));
      if (/^зубч/i.test(u)) { const n = Math.max(.5, Math.round(parseFloat(v.replace(',', '.'))*f*2)/2); x = String(n).replace('.', ',');   // «4 зубчика», «1,5 зубчика»
        u = Number.isInteger(n) ? plural(n, 'зубчик', 'зубчика', 'зубчиков') : 'зубчика'; }
      return x + (sp ? ' ' : u.length > 2 ? ' ' : '') + u; });
  if (out === line) out = line.replace(/^(\d+(?:[.,]\d+)?)\s+/, (m, v) => r(parseFloat(v.replace(',','.'))) + ' шт. ');
  return esc(out).replace(/^([\d.,]+\s*\S+)/, '<b>$1</b>');
}
// граммы в шагах тоже пересчитываем, кроме «по 40г», «40г на порцию» — это на одну тарелку
function scaleStep(s, f){
  if (f === 1) return esc(s);
  const r = v => { const x = v*f; return x >= 20 ? String(Math.round(x/5)*5) : x >= 3 ? String(Math.round(x)) : x.toFixed(1).replace('.', ','); };
  const num = v => parseFloat(v.replace(',', '.'));
  return esc(s).replace(/(^|[^\d,.\/])(по\s+)?(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?(\s*)(кг|мл|г|л)(?![а-яё])/gi,
    (m, pre, po, a, b, sp, u, off, all) => {
      const rest = all.slice(off + m.length, off + m.length + 40);
      if (po || /^[^.;!?]{0,25}?\(?\s*на\s+(?:одну\s+|1\s+|каждую\s+)?порци/i.test(rest)) return m;   // «по 50г», «40г сыра (на 1 порцию)» — на одну тарелку
      const one = v => /^(кг|л)$/i.test(u) ? String(Math.round(num(v)*f*10)/10).replace('.', ',') : r(num(v));
      return pre + '<b>' + one(a) + (b ? '–' + one(b) : '') + ' ' + u + '</b>'; });
}
function recipeHTML(parts, f){
  return parts.map(p => `<section class="card recipe">
    ${p.t || p.y ? `<h3>${esc(p.t || '')}${p.t && p.y ? ' · ' : ''}${p.y ? 'ингредиенты ' + esc(p.y) : ''}</h3>` : ''}
    ${p.i && p.i.length ? `<ul class="ings">${joinBroken(p.i).map(l => `<li>${scaleIng(l, f)}</li>`).join('')}</ul>` : ''}
    ${p.p && p.p.length ? `<ol class="steps">${p.p.map(noWM).filter(Boolean).map(s => `<li>${scaleStep(s, f)}</li>`).join('')}</ol>` : ''}
  </section>`).join('') || '<p class="small muted">Для этого блюда рецепт не нужен.</p>';

const familyFactor = () => members().reduce((a, m) => a + m.k, 0);
// Вес готового блюда: первая фраза из «Порции по меню» («190г сырников и 40г сметаны»), граммы × f
function portionFor(d, f){
  const first = String(d.w || '').replace(/^\s*\(на 1 день\)\s*/i, '').split(/\.\s+(?=[А-ЯЁA-Z])/)[0]
    .replace(/\s*[–-]\s*\d+\s*штук[а-яё]*/gi, '').replace(/[.\s]+$/, '');   // «– 3 штуки» на другой вес не пересчитать
  if (!/\d\s*г(?![а-яё])/i.test(first)) return '';
  return first.replace(/(\d+(?:[.,]\d+)?)\s*г(?![а-яё])/gi, (m, v) => fmt(Math.max(5, Math.round(parseFloat(v.replace(',', '.'))*f/5)*5)) + ' г');
}
// граммы порции одним числом (сумма всех «N г» из первой фразы «Порции по меню»)
const portionG = (d, k) => { const t = portionFor(d, k); return t ? [...t.matchAll(/([\d\s ]+)\s*г(?![а-яё])/gi)].reduce((a, m) => a + (+m[1].replace(/\D/g, '') || 0), 0) : 0; };
// порции всех, кто ест блюдо: «Юля ≈230 г · Андрей ≈260 г · Дети ≈105 г»
function familyGrams(d, sl){
  const who = members().filter(m => !sl || !skipped(sl.skip, m)); if (who.length < 2 || !portionG(d, 1)) return '';
  return `<div class="small muted">${who.map(m => `${esc(m.name)} ≈${fmt(portionG(d, m.k))} г`).join(' · ')}</div>`;
}
// калорийность дня по плану для каждого взрослого: блюда из разных меню могут дать больше нормы
function planOver(bi){
  return D.profiles.map(p => { const n = norm(p); if (!n.target) return null;
    const m = members().find(x => x.key === 'u:' + p.id);
    const kcal = TYPES.reduce((a, [t]) => { const sl = slotOf(bi, t), d = sl && byId(sl.id); return a + (d && !skipped(sl.skip, m) ? d.k * n.k : 0); }, 0);
    return kcal > n.target * 1.03 ? {name: p.name, kcal, target: n.target} : null; }).filter(Boolean);
}
// где блюдо стоит в плане: сначала выбранный блок
function planSlotOf(id){
  for (const b of [S.block, ...D.blocks.keys()]) for (const [t] of TYPES) { const sl = slotOf(b, t); if (sl && sl.id === id) return sl; }
  return null;
}

const NUTRI_RE = NUTRI.map(([re, ...v]) => [new RegExp('(?:^|[^а-яё])(?:' + re + ')', 'i'), ...v]);
const SPOON_G = (u, name) => (/^ст/.test(u) ? 15 : 5) * (/масл/i.test(name) ? 0.9 : /мук|крахмал|какао/i.test(name) ? 0.65 : /мед|мёд|сироп|соус|паст/i.test(name) ? 1.4 : 1);
/** Строка ингредиента → {g, k, p, f, c} или {skip} (соль, вода) или {miss} (не нашли в таблице) */
function nutriOf(line){
  // «200г филе (150г в вареном виде)» — считаем сырой вес, а не то, что в скобках
  const bare = String(line).replace(/\([^)]*\)/g, ' '), it0 = parseLine(bare), it = it0.q != null ? it0 : parseLine(line), low = String(line).toLowerCase().replace(/ё/g, 'е'), nm = it.name.toLowerCase().replace(/ё/g, 'е');
  const row = NUTRI_RE.find(([re]) => re.test(' ' + nm)) || NUTRI_RE.find(([re]) => re.test(' ' + low));
  if (!row) return {miss: it.name};
  let [, k, p, f, c, pc] = row;
  if (!k && !p && !f && !c) return {skip: true};
  if (!k) { const m = low.match(/(\d+(?:[.,]\d+)?)\s*%/); if (m) f = parseFloat(m[1].replace(',', '.')); k = Math.round(4*p + 9*f + 4*c); }   // молочное: жирность из «5%»
  let g = null;
  if (it.q == null) return {skip: true};                                     // «зелень по желанию»
  if (it.u === 'г' || it.u === 'мл') g = it.q;
  else if (/л\.$/.test(it.u)) g = it.q * SPOON_G(it.u, nm);
  else if (it.u === 'зуб.') g = it.q * 5;
  else if (it.u === 'шт') g = it.q * (pc || 0);
  if (!g) return {miss: it.name};
  return {g, k: k*g/100, p: p*g/100, f: f*g/100, c: c*g/100};
}
/** Сумма по списку строк: {k, p, f, c, g, miss: [названия]} */
function nutriSum(lines){
  const t = {k: 0, p: 0, f: 0, c: 0, g: 0, miss: []};
  joinBroken(lines || []).filter(l => /[а-яё]/i.test(l) && !/:$/.test(l)).forEach(l => { const n = nutriOf(l); if (n.miss) t.miss.push(n.miss); else if (!n.skip) ['k', 'p', 'f', 'c', 'g'].forEach(x => t[x] += n[x]); });
  return t;
}

function dishCalc(parts, shop, np){
  const base = l => shopKey(parseLine(l).name.replace(PCT, ' '));
  const ing = [].concat(...(parts || []).map(x => x.i || [])), keys = new Set(ing.map(base));
  const r = nutriSum(ing), x = nutriSum((shop || []).filter(l => !keys.has(base(l))));
  const out = {g: r.g, miss: r.miss.concat(x.miss)};
  ['k', 'p', 'f', 'c'].forEach(k => out[k] = (ing.length ? r[k] / np : 0) + x[k] / 2);
  return out;
}

}

  sheet(`<h2>Новый десерт</h2>
    <div class="field">Название<input id="nn" type="text" placeholder="Например, шарлотка"></div>
    <h3>Ингредиенты</h3><div id="ings" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn ghost sm" type="button" id="addIng">+ Ингредиент</button>
    <div class="field">Вес готового изделия после выпекания, г<input id="nw" type="number" inputmode="numeric" placeholder="взвесьте готовое"></div>
    <div class="card"><div class="small muted">Всего <span id="tot" class="num"></span> ккал</div><div class="row"><span class="big num" id="per"></span><span class="muted">ккал на 100 г</span></div></div>
    <button class="btn full" type="button" id="saveSweet">Сохранить десерт</button>`, sh => {
    const box = sh.querySelector('#ings');
    const draw = () => { box.innerHTML = rows.map((r,i) => `<div class="ing"><div class="field">${i ? '' : 'Продукт'}<select data-ri="${i}">${BASE.map((b,j) => `<option value="${j}" ${j === r[0] ? 'selected' : ''}>${b[0]}</option>`).join('')}</select></div><div class="field">${i ? '' : 'Граммы'}<input data-rg="${i}" type="number" inputmode="numeric" value="${r[1]}"></div><button class="x-del" type="button" aria-label="Убрать" data-rx="${i}">×</button></div>`).join(''); calc(); };
    const calc = () => { const tot = rows.reduce((a,r) => a + BASE[r[0]][1]*r[1]/100, 0), w = +sh.querySelector('#nw').value || 0; sh.querySelector('#tot').textContent = fmt(tot); sh.querySelector('#per').textContent = w ? fmt(tot/w*100) : '—'; return {tot, w}; };
    sh.addEventListener('input', e => { if (e.target.dataset.rg) rows[+e.target.dataset.rg][1] = +e.target.value || 0; calc(); });
    sh.addEventListener('change', e => { if (e.target.dataset.ri) { rows[+e.target.dataset.ri][0] = +e.target.value; calc(); } });
    sh.addEventListener('click', e => { const x = e.target.closest('[data-rx]'); if (x) { rows.splice(+x.dataset.rx, 1); draw(); } });
    sh.querySelector('#addIng').onclick = () => { rows.push([0,100]); draw(); };
    sh.querySelector('#saveSweet').onclick = () => { const {tot, w} = calc(), n = sh.querySelector('#nn').value.trim();
      if (!n || !w) return toast('Впишите название и вес готового изделия');
      const k100 = Math.round(tot/w*100), ingredients = rows.map(r => ({n: BASE[r[0]][0], g: r[1]}));
      D.catalog.desserts.unshift({n, k100}); close(); render(); save('dessert', {name: n, k100, ingredients, weight: w}, 'Сохранено: ' + n); };
    draw();
  });
}
// Telegram 8.0+: иконка мини-приложения на экране «Домой» (работает только со страницы на GitHub Pages)
const homeOK = () => { try { const t = window.Telegram && Telegram.WebApp; return !!(t && t.initData && t.addToHomeScreen && t.isVersionAtLeast && t.isVersionAtLeast('8.0')); } catch (e) { return false; } };
function profileSheet(first){
  const p = myProfile(), vits = D.vitamins.map(v => ({...v, times: [...v.times]})), kids = D.kids.map(k => ({...k})), kidsBefore = D.kids.map(k => ({...k}));
  const f = (id, label, val, attrs) => `<div class="field">${label}<input id="${id}" ${attrs || ''} value="${val == null ? '' : esc(val)}"></div>`;
  sheet(`<h2>${first ? 'Давайте познакомимся' : 'Мой профиль'}</h2>
    ${first ? '<p class="small muted" style="margin:0">Чтобы посчитать вашу норму калорий, нужны рост, вес и возраст. Эти данные видны только в вашей таблице.</p>' : ''}
    ${f('pf-name','Имя',p.name,'type="text"')}
    <div class="row"><div class="field sp">Пол<select id="pf-sex"><option value="f" ${p.sex === 'f' ? 'selected' : ''}>женский</option><option value="m" ${p.sex === 'm' ? 'selected' : ''}>мужской</option></select></div>${f('pf-age','Возраст',p.age,'type="number" inputmode="numeric"')}</div>
    <div class="row">${f('pf-h','Рост, см',p.height,'type="number" inputmode="numeric"')}${f('pf-w','Вес, кг',p.weight,'type="number" inputmode="decimal" step="0.1"')}</div>
    <div class="field">Активность<select id="pf-act">${ACTS.map(([v,t]) => `<option value="${v}" ${Number(v) === p.activity ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <div class="seg" id="pf-goal">${GOALS.map(([g,t]) => `<button type="button" aria-pressed="${p.goal === g}" data-g="${g}">${t}</button>`).join('')}</div>
    <div class="card"><div class="row"><span class="big num" id="pf-norm">—</span><span class="muted sp">ккал в день</span><span class="small muted" id="pf-k"></span></div></div>
    <div class="row">${f('pf-water','Вода в день, л (0 — без напоминаний)',(p.water/1000).toString().replace('.',','),'type="text" inputmode="decimal"')}${f('pf-cup','Моя кружка, мл',p.cup || 250,'type="number" inputmode="numeric" min="50" max="1000" step="10"')}</div>
    <div class="field">Напоминать о замерах<select id="pf-bday">${['не напоминать','понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'].map((t, i) => `<option value="${i}" ${i === (p.body_day || 0) ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <label class="row small" style="gap:8px"><input type="checkbox" id="pf-diary" ${p.diary ? 'checked' : ''}> Вести дневник калорий и получать итог дня в 21:00</label>
    <h3>Витамины и напоминания</h3><div id="pf-vits" style="display:flex;flex-direction:column;gap:6px"></div>
    <button class="btn ghost sm" type="button" id="pf-addvit">+ Витамин</button>
    <h3>Дети (для расчёта порций)</h3><div id="pf-kids" style="display:flex;flex-direction:column;gap:6px"></div>
    <button class="btn ghost sm" type="button" id="pf-addkid">+ Ребёнок</button>
    <button class="btn full" type="button" id="pf-save">Сохранить</button>
    ${homeOK() ? `<h3>Иконка на экране телефона</h3>
    <p class="small muted" style="margin:0">Приложение откроется с экрана «Домой», как обычное, через ваш Telegram.</p>
    <button class="btn ghost sm" type="button" id="pf-home">📱 Добавить на главный экран</button>` : ''}
    <h3>Открывать в браузере</h3>
    <p class="small muted" style="margin:0">Бот пришлёт в чат личную ссылку. Откройте её в Safari или Chrome и добавьте на экран «Домой» или рабочий стол.</p>
    <div class="row"><button class="btn ghost sm" type="button" id="pf-web">Прислать ссылку</button><button class="btn ghost sm" type="button" id="pf-webnew">Выпустить новую</button></div>`, sh => {
    let goal = p.goal;
    const v = id => sh.querySelector('#' + id).value;
    const read = () => ({name: v('pf-name').trim() || p.name, sex: v('pf-sex'), age: +v('pf-age') || null, height: +v('pf-h') || null, weight: parseFloat(v('pf-w').replace(',', '.')) || null,
      activity: +v('pf-act'), goal, water: Math.round((parseFloat(v('pf-water').replace(',', '.')) || 0)*1000), diary: sh.querySelector('#pf-diary').checked,
      cup: Math.min(1000, Math.max(50, Math.round(+v('pf-cup') || 250))), body_day: +v('pf-bday') || 0});
    const upd = () => { const n = norm(read()); sh.querySelector('#pf-norm').textContent = n.target ? fmt(n.target) : '—'; sh.querySelector('#pf-k').textContent = n.target ? 'порция ×' + n.k.toFixed(2).replace('.', ',') : 'заполните рост, вес, возраст'; };
    const drawV = () => sh.querySelector('#pf-vits').innerHTML = vits.map((x,i) => `<div class="vitedit">
        <div class="ing" style="grid-template-columns:minmax(0,1fr) 28px"><input class="search" id="pf-vn-${i}" data-vn="${i}" placeholder="Название" value="${esc(x.name)}"><button class="x-del" type="button" aria-label="Удалить витамин" data-vx="${i}">×</button></div>
        <div class="times">${x.times.map((t,j) => `<span class="timechip"><input type="time" id="pf-vt-${i}-${j}" data-vt="${i}:${j}" value="${esc(t)}" aria-label="Время приёма ${j+1}">${x.times.length > 1 ? `<button class="x-del" type="button" aria-label="Убрать время" data-vtx="${i}:${j}">×</button>` : ''}</span>`).join('')}
        ${x.times.length < 6 ? `<button class="btn ghost sm" type="button" data-vadd="${i}">+ время</button>` : ''}</div></div>`).join('') || '<span class="small muted">Пока нет</span>';
    const drawK = () => sh.querySelector('#pf-kids').innerHTML = kids.map((x,i) => `<div class="ing" style="grid-template-columns:minmax(0,1fr) 92px 28px"><input class="search" data-kn="${i}" placeholder="Имя" value="${esc(x.name)}"><select class="search" data-kk="${i}">${[.3,.4,.5,.6,.7,.8,1].map(k => `<option value="${k}" ${k === x.k ? 'selected' : ''}>×${String(k).replace('.',',')}</option>`).join('')}</select><button class="x-del" type="button" aria-label="Убрать" data-kx="${i}">×</button></div>`).join('') || '<span class="small muted">Пока нет</span>';
    drawV(); drawK(); upd();
    sh.addEventListener('input', e => { const d = e.target.dataset;
      if (d.vn) vits[+d.vn].name = e.target.value; else if (d.vt) { const [i, j] = d.vt.split(':'); vits[+i].times[+j] = e.target.value; } else if (d.kn) kids[+d.kn].name = e.target.value; upd(); });
    sh.addEventListener('change', e => { const d = e.target.dataset; if (d.kk) kids[+d.kk].k = +e.target.value; upd(); });
    sh.addEventListener('click', e => { const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
      if (d.g) { goal = d.g; sh.querySelectorAll('[data-g]').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === goal)); upd(); }
      else if (d.vx) { vits.splice(+d.vx, 1); drawV(); }
      else if (d.vtx) { const [i, j] = d.vtx.split(':'); vits[+i].times.splice(+j, 1); drawV(); }
      else if (d.vadd) { const x = vits[+d.vadd], last = x.times[x.times.length - 1] || '09:00', h = Math.min(23, +last.slice(0, 2) + 4);
        x.times.push(('0' + h).slice(-2) + last.slice(2)); drawV(); } else if (d.kx) { kids.splice(+d.kx, 1); drawK(); } });
    const hb = sh.querySelector('#pf-home');
    if (hb) hb.onclick = () => { try { Telegram.WebApp.addToHomeScreen(); } catch (e) { toast('Telegram не поддерживает это на вашем телефоне'); } };
    const web = renew => () => save('weblink', {renew}).then(() => toast('Ссылка в чате с ботом'));
    sh.querySelector('#pf-web').onclick = web(false); sh.querySelector('#pf-webnew').onclick = web(true);
    sh.querySelector('#pf-addvit').onclick = () => { vits.push({id: uid(), name:'', times:['09:00']}); drawV(); };
    sh.querySelector('#pf-addkid').onclick = () => { kids.push({id: uid(), name:'Ребёнок ' + (kids.length + 1), k:.5}); drawK(); };
    sh.querySelector('#pf-save').onclick = () => {
      const r = read(); Object.assign(p, r);
      D.vitamins = vits.filter(x => x.name.trim()).map(x => ({...x, times: [...new Set(x.times.filter(Boolean))].sort()}));
      const keptKids = kids.filter(x => x.name.trim());
      const remove = kidsBefore.filter(b => !keptKids.some(k => k.id === b.id)).map(b => b.id);
      const upsert = keptKids.filter(k => { const b = kidsBefore.find(x => x.id === k.id); return !b || b.name !== k.name || b.k !== k.k; });
      D.kids = keptKids;
      close(); render(); toast('Сохраняю…');
      Promise.all([save('profile', {name:r.name, sex:r.sex, age:r.age, height:r.height, weight:r.weight, activity:r.activity, goal:r.goal, water_goal:r.water, diary:r.diary ? 'yes' : 'no', cup:r.cup, body_day:r.body_day || ''}),
        save('vitamins', {list: D.vitamins}).then(list => { D.vitamins = list; }),
        (remove.length || upsert.length) ? save('kids', {upsert, remove}).then(list => { D.kids = list; }) : null])
        .then(() => { render(); toast('Профиль сохранён'); });
    };
  });
}

// ---------- выбор из списка на Android ----------
// В Telegram на части Android-телефонов обычный <select> не раскрывается. Показываем свой список поверх экрана,
// выбор записываем в тот же <select> и шлём change — остальной код ничего не замечает.
const customSelect = () => { try { return (window.Telegram && Telegram.WebApp && Telegram.WebApp.platform === 'android') || /Android/i.test(navigator.userAgent); } catch (e) { return false; } };
function pickFrom(sel){
  const ov = document.createElement('div'); ov.className = 'shade'; ov.style.zIndex = 30;
  const fc = sel.closest('.field') && sel.closest('.field').firstChild;          // подпись — только текст перед списком
  const label = fc && fc.nodeType === 3 ? fc.textContent.trim() : '';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${label ? `<h3>${esc(label)}</h3>` : ''}
    <div class="list">${[...sel.options].map((o, i) => `<button class="dish" type="button" data-opt="${i}" aria-pressed="${o.selected}"${o.selected ? ' style="border-color:var(--basil)"' : ''}><span class="sp nm">${esc(o.text)}</span>${o.selected ? '<span class="kc">✓</span>' : ''}</button>`).join('')}</div></div>`;
  const opened = Date.now();
  ov.addEventListener('click', e => { if (Date.now() - opened < 450) return;   // «клик» того же касания, которым открыли список
    const b = e.target.closest('[data-opt]');
    if (b) { sel.selectedIndex = +b.dataset.opt; sel.dispatchEvent(new Event('input', {bubbles: true})); sel.dispatchEvent(new Event('change', {bubbles: true})); }
    if (b || e.target === ov) ov.remove(); });
  $('#phone').appendChild(ov);
}
document.addEventListener('pointerdown', e => { const sel = e.target.closest && e.target.closest('select');
  if (!sel || sel.disabled || !customSelect()) return; e.preventDefault(); sel.blur(); pickFrom(sel); }, true);
['mousedown', 'click'].forEach(t => document.addEventListener(t, e => { if (e.target.closest && e.target.closest('select') && customSelect()) e.preventDefault(); }, true));

// для локальной проверки сборки (tools/smoke.js); в Telegram __smoke не задан

start();
})();
